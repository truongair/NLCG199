[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlcg119-server"
version = "0.1.0"
description = "Protocol-compatible Python server skeleton for NLCG119-TI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nlcg119-server = "nlcg119_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
